name: Expand Myrial source

on:
  push:
    branches:
      - agent/myrial-movement-assets

permissions:
  contents: write

jobs:
  expand-source:
    if: github.event.head_commit.message != 'Expand Myrial source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore archived game source
        working-directory: monrpg
        run: |
          node bootstrap.cjs
          rm -f bootstrap.cjs payload*.txt

      - name: Commit readable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monrpg
          git commit -m "Expand Myrial source"
          git push
